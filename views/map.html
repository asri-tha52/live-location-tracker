<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map Tracking & Geofencing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: #f1f5f9;
            overflow: hidden;
        }

        .hud-header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: #334155;
            color: #f1f5f9;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover { background: #475569; }

        .status-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .status-offline {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid #94a3b8;
        }

        .status-breach {
            background: rgba(239, 68, 68, 0.3) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444 !important;
            animation: flash-red 1s infinite;
        }

        @keyframes flash-red {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .hud-metrics {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            flex-wrap: wrap;
            color: #94a3b8;
        }

        .hud-metrics strong {
            color: #38bdf8;
            font-weight: 600;
        }

        .action-btn {
            background: #334155;
            color: #f1f5f9;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .action-btn:hover { background: #475569; }
        .action-btn.active { background: #0284c7; color: white; }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #1e293b;
        }

        .address-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid #475569;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            color: #e2e8f0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulsing-marker {
            width: 18px;
            height: 18px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            background: #0284c7;
            box-shadow: 0 0 10px #0284c7;
            animation: radar-ping 1.8s infinite;
        }

        @keyframes radar-ping {
            0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.8); }
            70% { box-shadow: 0 0 0 16px rgba(2, 132, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }
    </style>
</head>

<body>
    <header class="hud-header">
        <div class="hud-left">
            <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
            <strong id="target-id-label" style="font-size: 15px; color: #fff;">{{ id }}</strong>
            <span id="status-pill" class="status-pill status-online">
                <i class="fa-solid fa-circle-dot"></i> LIVE
            </span>
        </div>

        <div class="hud-metrics">
            <span>Coords: <strong id="coords-text">--</strong></span>
            <span>Acc: <strong id="accuracy-text">--</strong></span>
            <span>Speed: <strong id="speed-text">--</strong></span>
            <span>Battery: <strong id="battery-text">--</strong></span>
            <span>Net: <strong id="network-text">--</strong></span>
            <span>Points: <strong id="points-count">--</strong></span>
        </div>

        <div class="hud-left">
            <button class="action-btn active" id="follow-toggle" onclick="toggleFollow()">
                <i class="fa-solid fa-crosshairs"></i> Follow
            </button>
            <button class="action-btn" id="geofence-btn" onclick="toggleGeofenceModal()">
                <i class="fa-solid fa-draw-polygon"></i> Geofence
            </button>
            <a id="gmaps-link" href="#" target="_blank" class="action-btn">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Google Maps
            </a>
            <div class="dropdown is-hoverable is-right">
                <div class="dropdown-trigger">
                    <button class="action-btn">
                        <i class="fa-solid fa-download"></i> Export
                    </button>
                </div>
                <div class="dropdown-menu" style="z-index: 2000;">
                    <div class="dropdown-content" style="background:#1e293b; border: 1px solid #334155;">
                        <a href="/api/target/export?id={{ id }}&format=csv" class="dropdown-item has-text-white">📄 Export CSV</a>
                        <a href="/api/target/export?id={{ id }}&format=gpx" class="dropdown-item has-text-white">🗺️ Export GPX</a>
                        <a href="/api/target/export?id={{ id }}&format=kml" class="dropdown-item has-text-white">🌍 Export KML</a>
                    </div>
                </div>
            </div>
            <button class="action-btn" onclick="clearTrailHistory()" style="color: #f87171;">
                <i class="fa-solid fa-route"></i> Clear
            </button>
        </div>
    </header>

    <div id="map"></div>

    <div class="address-bar" id="address-bar">
        <i class="fa-solid fa-location-dot" style="color: #38bdf8;"></i>
        <span id="address-text">Resolving physical address...</span>
    </div>

    <!-- Safe JSON Storage -->
    <script type="application/json" id="target-data">{{- targetJSON }}</script>
    <script type="application/json" id="geofence-data">{{- geofenceJSON }}</script>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script>
        const targetDataEl = document.getElementById("target-data")
        const initialTarget = targetDataEl && targetDataEl.textContent ? JSON.parse(targetDataEl.textContent) : {}
        const id = initialTarget.id

        const geofenceDataEl = document.getElementById("geofence-data")
        let activeGeofence = geofenceDataEl && geofenceDataEl.textContent ? JSON.parse(geofenceDataEl.textContent) : null

        let autoFollow = true
        let currentLatLng = [initialTarget.lat || 0, initialTarget.lng || 0]
        let currentLastSeen = initialTarget.lastSeen || Date.now()

        // Elements
        const statusPill = document.getElementById("status-pill")
        const coordsText = document.getElementById("coords-text")
        const accuracyText = document.getElementById("accuracy-text")
        const speedText = document.getElementById("speed-text")
        const batteryText = document.getElementById("battery-text")
        const networkText = document.getElementById("network-text")
        const pointsCount = document.getElementById("points-count")
        const gmapsLink = document.getElementById("gmaps-link")
        const addressText = document.getElementById("address-text")
        const followToggleBtn = document.getElementById("follow-toggle")
        const geofenceBtn = document.getElementById("geofence-btn")

        // Map setup
        const map = L.map('map', { zoomControl: true }).setView(currentLatLng, 15)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map)

        // Custom pulsing marker
        const liveIcon = L.divIcon({
            className: 'pulsing-marker-container',
            html: '<div class="pulsing-marker"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        })
        const currentMarker = L.marker(currentLatLng, { icon: liveIcon }).addTo(map)
        currentMarker.bindPopup(`<b>${id} (Live Position)</b>`).openPopup()

        // GPS Accuracy circle
        const accuracyCircle = L.circle(currentLatLng, {
            radius: initialTarget.accuracy || 20,
            color: '#0284c7',
            fillColor: '#38bdf8',
            fillOpacity: 0.15,
            weight: 1
        }).addTo(map)

        // Breadcrumb Trail Polyline
        const historyCoords = (initialTarget.history || []).map(p => [p.lat, p.lng])
        if (historyCoords.length === 0) historyCoords.push(currentLatLng)

        const polyline = L.polyline(historyCoords, {
            color: '#f59e0b',
            weight: 4,
            opacity: 0.85,
            dashArray: '6, 8',
            lineJoin: 'round'
        }).addTo(map)

        // Start marker
        let startMarker = null
        if (historyCoords.length > 1) {
            startMarker = L.circleMarker(historyCoords[0], {
                radius: 6,
                color: '#22c55e',
                fillColor: '#22c55e',
                fillOpacity: 1
            }).addTo(map).bindPopup("<b>Initial Starting Point</b>")
        }

        // Geofence Circle
        let geofenceCircle = null
        function renderGeofence() {
            if (geofenceCircle) map.removeLayer(geofenceCircle)
            if (activeGeofence && activeGeofence.active) {
                geofenceCircle = L.circle([activeGeofence.lat, activeGeofence.lng], {
                    radius: activeGeofence.radius,
                    color: '#ef4444',
                    fillColor: '#f87171',
                    fillOpacity: 0.2,
                    weight: 2,
                    dashArray: '4, 4'
                }).addTo(map)
                geofenceCircle.bindPopup(`<b>Active Geofence Perimeter: ${activeGeofence.radius}m</b>`)
                geofenceBtn.classList.add("active")
            } else {
                geofenceBtn.classList.remove("active")
            }
        }
        renderGeofence()

        function toggleGeofenceModal() {
            if (activeGeofence && activeGeofence.active) {
                if (confirm(`Geofence of ${activeGeofence.radius}m is active. Remove it?`)) {
                    saveGeofence(null, null, null, false)
                }
            } else {
                const radius = prompt("Enter geofence radius in meters around current position:", "500")
                if (radius && !isNaN(parseInt(radius))) {
                    saveGeofence(currentLatLng[0], currentLatLng[1], parseInt(radius), true)
                }
            }
        }

        async function saveGeofence(lat, lng, radius, active) {
            try {
                const res = await fetch("/api/target/geofence", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, lat, lng, radius, active })
                })
                const data = await res.json()
                activeGeofence = data.geofence
                renderGeofence()
            } catch (e) {}
        }

        function updateHUD(target) {
            coordsText.textContent = `${target.lat.toFixed(5)}, ${target.lng.toFixed(5)}`
            accuracyText.textContent = target.accuracy ? `±${Math.round(target.accuracy)}m (${target.type || 'GPS'})` : (target.type || 'GPS')
            speedText.textContent = target.speed != null && target.speed > 0 ? `${(target.speed * 3.6).toFixed(1)} km/h` : 'Stationary'
            batteryText.textContent = target.battery != null ? `${Math.round(target.battery)}%${target.charging ? ' ⚡' : ''}` : 'N/A'
            networkText.textContent = target.network || 'Unknown'
            pointsCount.textContent = `${(target.historyLength || (target.history ? target.history.length : 1))} pts`
            gmapsLink.href = `https://www.google.com/maps?q=${target.lat},${target.lng}`

            const isOnline = (Date.now() - (target.time || target.lastSeen || currentLastSeen)) <= 20000
            if (target.geofenceBreach) {
                statusPill.className = "status-pill status-breach"
                statusPill.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> GEOFENCE BREACH`
            } else if (isOnline) {
                statusPill.className = "status-pill status-online"
                statusPill.innerHTML = `<i class="fa-solid fa-circle-dot"></i> LIVE`
            } else {
                statusPill.className = "status-pill status-offline"
                statusPill.innerHTML = `<i class="fa-solid fa-circle-stop"></i> OFFLINE`
            }
        }

        updateHUD(initialTarget)

        // Reverse Geocoding
        let lastGeoLookup = 0
        async function reverseGeocode(lat, lng) {
            if (Date.now() - lastGeoLookup < 10000) return
            lastGeoLookup = Date.now()
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                const data = await res.json()
                if (data && data.display_name) addressText.textContent = data.display_name
            } catch (err) {}
        }
        reverseGeocode(initialTarget.lat, initialTarget.lng)

        function toggleFollow() {
            autoFollow = !autoFollow
            if (autoFollow) {
                followToggleBtn.classList.add("active")
                map.panTo(currentLatLng)
            } else {
                followToggleBtn.classList.remove("active")
            }
        }

        async function clearTrailHistory() {
            if (!confirm("Clear trail route for this target?")) return
            try {
                const res = await fetch("/api/target/clear-history", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id })
                })
                if (res.ok) {
                    polyline.setLatLngs([currentLatLng])
                    if (startMarker) {
                        map.removeLayer(startMarker)
                        startMarker = null
                    }
                    pointsCount.textContent = "1 pt"
                }
            } catch (e) {}
        }

        // Socket.IO
        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket', 'polling']
        })

        socket.on("map-data", data => {
            if (data.id === id) {
                currentLatLng = [data.lat, data.lng]
                currentLastSeen = data.time || Date.now()

                currentMarker.setLatLng(currentLatLng)
                accuracyCircle.setLatLng(currentLatLng)
                if (data.accuracy) accuracyCircle.setRadius(data.accuracy)

                polyline.addLatLng(currentLatLng)

                if (!startMarker && polyline.getLatLngs().length > 1) {
                    startMarker = L.circleMarker(polyline.getLatLngs()[0], {
                        radius: 6,
                        color: '#22c55e',
                        fillColor: '#22c55e',
                        fillOpacity: 1
                    }).addTo(map).bindPopup("<b>Initial Starting Point</b>")
                }

                if (autoFollow) map.panTo(currentLatLng)

                updateHUD(data)
                reverseGeocode(data.lat, data.lng)
            }
        })

        socket.on("geofence-breach", data => {
            if (data.id === id) {
                statusPill.className = "status-pill status-breach"
                statusPill.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> GEOFENCE BREACH`
            }
        })

        socket.on("history-cleared", clearedId => {
            if (clearedId === id) {
                polyline.setLatLngs([currentLatLng])
                if (startMarker) {
                    map.removeLayer(startMarker)
                    startMarker = null
                }
                pointsCount.textContent = "1 pt"
            }
        })

        setInterval(() => {
            const diffSec = (Date.now() - currentLastSeen) / 1000
            if (diffSec > 20 && !statusPill.classList.contains("status-breach")) {
                statusPill.className = "status-pill status-offline"
                statusPill.innerHTML = `<i class="fa-solid fa-circle-stop"></i> OFFLINE`
            }
        }, 3000)
    </script>
</body>

</html>
