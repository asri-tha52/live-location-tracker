<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Live Location Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-icon {
            font-size: 40px;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .input {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
            border-radius: 10px;
        }

        .input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 0.125em rgba(56, 189, 248, 0.25) !important;
        }

        .input::placeholder {
            color: #64748b;
        }

        .login-btn {
            background: #2563eb;
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
            color: white;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="login-icon">
            <i class="fa-solid fa-satellite-dish"></i>
        </div>
        <h1 class="title is-4 has-text-white mb-1">Tracker Console</h1>
        <p class="subtitle is-7 has-text-grey-light mb-5">Authorized Administrator Access Only</p>

        {{ if(error) }}
        <div class="notification is-danger is-light py-2 px-3 mb-4 is-size-7">
            {{ error }}
        </div>
        {{/}}

        <form action="/login" method="post">
            <div class="field mb-3">
                <div class="control has-icons-left">
                    <input type="text" class="input" placeholder="Admin Username" required name="username" autofocus>
                    <span class="icon is-small is-left has-text-grey">
                        <i class="fa-solid fa-user"></i>
                    </span>
                </div>
            </div>

            <div class="field mb-4">
                <div class="control has-icons-left">
                    <input type="password" class="input" placeholder="Admin Password" required name="password">
                    <span class="icon is-small is-left has-text-grey">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="button is-fullwidth login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Sign In
            </button>
        </form>
    </div>
</body>

</html>
